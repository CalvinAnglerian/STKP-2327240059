  # DISTRIBUTED SYSTEM ARCHITECTURE & CLOCK SYNCRONIZATION - Materi 10
  presentation:
    image: python:3.12-slim
    container_name: presentation
    volumes:
      - ./python:/app
    tty: true
    environment:
      - OFFSET=15
      - ROLE=slave
    networks:
      - docker_network
  application:
    image: python:3.12-slim
    container_name: application
    volumes:
      - ./python:/app
    tty: true
    environment:
      - OFFSET=10
      - ROLE=slave
    networks:
      - docker_network
  database:
    image: python:3.12-slim
    container_name: database
    volumes:
      - ./python:/app
    tty: true
    environment:
      - OFFSET=-5
      - ROLE=master
    networks:
      - docker_network
